name: Build Obico

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate files
        run: |
          test -f will-obico/docker-compose.yml
          test -f will-obico/umbrel-app.yml
          echo "Obico Umbrel package OK"