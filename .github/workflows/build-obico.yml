name: Build Obico

on:
  workflow_dispatch:
  push:
    paths:
      - "will-obico/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Obico Web
        uses: docker/build-push-action@v6
        with:
          context: ./will-obico
          file: ./will-obico/Dockerfile
          push: true
          tags: |
            ghcr.io/williamcarlos2/will-obico-web:latest
            ghcr.io/williamcarlos2/will-obico-web:${{ github.sha }}