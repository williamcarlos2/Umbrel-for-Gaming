name: Build Orca Calibration

on:
  push:
    branches:
      - main
    paths:
      - "will-orca-calibration/**"
      - ".github/workflows/build-orca-calibration.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./will-orca-calibration
          file: ./will-orca-calibration/Dockerfile
          push: true
          tags: |
            ghcr.io/williamcarlos2/will-orca-calibration:latest
            ghcr.io/williamcarlos2/will-orca-calibration:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/williamcarlos2/Umbrel-for-Gaming