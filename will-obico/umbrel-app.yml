manifestVersion: 1

id: will-obico
name: Obico
tagline: Detecção inteligente de falhas para impressoras 3D

category: utilities
version: "1.0.0"

description: >-
  Transforme sua impressora 3D em uma impressora inteligente.
  O Obico monitora suas impressões, detecta falhas automaticamente
  usando inteligência artificial e permite acompanhar suas impressoras
  remotamente. Compatível com OctoPrint e outras plataformas.

developer: The Obico Team
website: https://www.obico.ai
repo: https://github.com/TheSpaghettiDetective/obico-server
support: https://github.com/TheSpaghettiDetective/obico-server/issues

submitter: William

dependencies: []

port: 3334

icon: icon.jpg

gallery:
  - Screen001.jpg
  - Screen002.jpg
  - Screen003.jpg

releaseNotes: >-
  Primeira versão do Obico empacotada para UmbrelOS.
  Inclui servidor Obico self-hosted, detecção de falhas
  por inteligência artificial, integração com OctoPrint
  e monitoramento das impressões.
