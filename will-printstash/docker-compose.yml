version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: will-printstash_printstash_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  printstash:
    image: ghcr.io/xiao-villamor/printstash:0.14.0
    restart: unless-stopped
    stop_grace_period: 60s

    environment:
      VAULT_SETUP_MODE: trusted_network
      VAULT_RESTART_ENABLED: "true"
      TZ: America/Sao_Paulo

    mem_limit: 2g
    mem_reservation: 1g
    memswap_limit: 3g
    cpus: 2

    volumes:
      - ${APP_DATA_DIR}/data:/data
      - home1_volume:/mnt/library

volumes:
  home1_volume:
    external: true