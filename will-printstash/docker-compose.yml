services:
  app_proxy:
    environment:
      APP_HOST: will-printstash_frontend_1
      APP_PORT: 3000

  frontend:
    image: ghcr.io/xiao-villamor/printstash-frontend:0.13.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  api:
    image: ghcr.io/xiao-villamor/printstash-api-lite:0.13.0
    restart: unless-stopped
    environment:
      VAULT_SETUP_MODE: trusted_network
      VAULT_RESTART_ENABLED: "true"
      TZ: "America/Sao_Paulo"
    volumes:
      - printstash_data:/data/files
      - printstash_thumbs:/data/thumbs
      - printstash_db:/data/db
      - printstash_staging:/data/staging
      - printstash_backups:/data/backups
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  printstash_data:
  printstash_thumbs:
  printstash_db:
  printstash_staging:
  printstash_backups: