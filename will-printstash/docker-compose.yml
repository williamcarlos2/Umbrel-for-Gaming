# PrintStash v0.15.0 — Umbrel
# Instalação limpa: banco e dados internos em APP_DATA_DIR; NAS montado somente leitura.
# Preserve o serviço app_proxy: ele integra o PrintStash ao proxy do Umbrel.

services:
  app_proxy:
    environment:
      APP_HOST: will-printstash_printstash_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  printstash:
    image: ghcr.io/xiao-villamor/printstash:0.15.0
    restart: unless-stopped
    stop_grace_period: 60s

    environment:
      VAULT_SETUP_MODE: trusted_network
      VAULT_RESTART_ENABLED: "true"
      TZ: America/Sao_Paulo

    mem_limit: 2g
    mem_reservation: 1g
    memswap_limit: 3g
    cpus: 2

    volumes:
      # Dados exclusivos desta nova instalação: SQLite, previews, cache e backups.
      - ${APP_DATA_DIR:?APP_DATA_DIR precisa estar definido no .env}/data:/data

      # Biblioteca do NAS: preserva os originais e impede gravações pelo PrintStash.
      - home1_volume:/mnt/library:ro

volumes:
  home1_volume:
    external: true
