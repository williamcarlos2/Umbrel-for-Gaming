id: will-retrovault
category: media
name: RetroVault
version: "1.0.0"
tagline: Self-hosted retro game collection manager
description: >-
  RetroVault is a self-hosted command center for retro game collectors.
  Track your games, collection value, purchase history, condition and
  market prices in one place.

  It includes collection management, wishlist tracking, play logs,
  price tracking, flip calculations, field tools, achievements and
  multiple retro gaming platforms.

