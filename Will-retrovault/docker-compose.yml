services:

  app_proxy:
    environment:
      APP_HOST: will-retrovault_retrovault_1
      APP_PORT: 3000

  retrovault:
    image: ghcr.io/williamcarlos2/retrovault:latest
    restart: on-failure
    stop_grace_period: 1m

    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/logs:/app/logs

    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/app/data/retrovault.db