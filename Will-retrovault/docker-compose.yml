version: "3.7"

services:

  app_proxy:
    environment:
      APP_HOST: retrovault
      APP_PORT: 3000

  retrovault:
    image: ghcr.io/williamcarlos2/retrovault:latest
    restart: on-failure
    stop_grace_period: 1m

    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/logs:/app/logs

    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: file:/app/data/retrovault.db

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s